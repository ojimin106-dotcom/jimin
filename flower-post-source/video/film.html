<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>꽃말 우체국 영상</title>
<style>
:root {
  --wine: #6B2C3B; --wine-deep: #4E1F2B; --rose: #8E4A5A; --blush: #F5E3E0; --blush-2: #EDD0CB;
  --paper: #FBF6F1; --white: #FFFDFA; --ink: #3A2128; --muted: #6E5359; --line: #E6D3CF;
  --serif: 'Noto Serif CJK KR', serif; --sans: 'Noto Sans CJK KR', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; overflow: hidden; }
#stage { position: relative; overflow: hidden; font-family: var(--sans); color: var(--ink); }
.scene { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
.serif { font-family: var(--serif); }
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.eyebrow { letter-spacing: .3em; font-weight: 700; color: var(--rose); }
.petal { position: absolute; border-radius: 50% 50% 50% 0; background: var(--rose); opacity: .5; }
.disc { position: absolute; border-radius: 50%; background: var(--blush-2); }
.chip { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; font-weight: 700; }
.card { background: var(--white); border: 2px solid var(--line); border-radius: 36px; }
img { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const IMG = '../dist/assets/img/';
const P = new URLSearchParams(location.search);
const V = P.get('v') || 'promo';
const TALL = V !== 'promo';
const W = TALL ? 1080 : 1920, H = TALL ? 1920 : 1080;
const DUR = TALL ? 15 : 30;
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

const ICON = {
  letter: '<svg viewBox="0 0 24 24" fill="none" stroke="#6B2C3B" stroke-width="1.4" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="1.5"/><path d="M3 7l9 6 9-6"/><circle cx="12" cy="14" r="2.2" fill="#6B2C3B"/></svg>',
  flower: '<svg viewBox="0 0 24 24" fill="none" stroke="#6B2C3B" stroke-width="1.4" stroke-linecap="round"><path d="M12 13c-2-3-6-3-6 0s4 3 6 0zm0 0c2-3 6-3 6 0s-4 3-6 0zm0 0c-3-2-3-6 0-6s3 4 0 6zm0 0v8"/></svg>',
  store: '<svg viewBox="0 0 24 24" fill="none" stroke="#6B2C3B" stroke-width="1.4" stroke-linejoin="round"><path d="M4 10h16v10H4z"/><path d="M3 10l2-6h14l2 6"/><path d="M10 20v-5h4v5"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="#6B2C3B" stroke-width="1.4" stroke-linejoin="round"><path d="M3 8l9-4 9 4v8l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v8"/></svg>'
};
function flower(n, color, center, size) {
  let s = '';
  for (let i = 0; i < n; i++) s += `<ellipse cx="50" cy="30" rx="${Math.max(6, Math.floor(40 / n) + 5)}" ry="20" fill="${color}" transform="rotate(${(i * 360 / n).toFixed(1)} 50 50)"/>`;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}"><circle cx="50" cy="50" r="48" fill="#FFFDFA"/>${s}<circle cx="50" cy="50" r="11" fill="${center}"/></svg>`;
}
function petals(list) {
  return list.map(([x, y, s, c, d]) => `<span class="petal" data-loop="drift" data-d="${d}" style="left:${x}px;top:${y}px;width:${s}px;height:${s * 1.4}px;background:${c}"></span>`).join('');
}

/* 장면: data-scene="시작초" (나중 장면이 위에 겹쳐 페이드 인)
   요소: data-in="초" data-fx="up|fade|pop|left|right|grow|down" [data-dur]
   반복: data-loop="float|drift|spin" */
const FILMS = {
promo: `
<section class="scene" data-scene="0" style="background:var(--blush)">
  ${petals([[180, 120, 26, '#8E4A5A', 0], [1500, 90, 22, '#6B2C3B', 2], [1180, 860, 30, '#8E4A5A', 4], [880, 200, 18, '#B79BD6', 1]])}
  <div class="disc" data-in="0.2" data-fx="pop" style="left:1140px;top:150px;width:780px;height:780px"></div>
  <div class="abs" style="left:1230px;top:240px;width:600px;height:600px" data-in="0.5" data-fx="pop"><img data-loop="float" src="${IMG}logo.png" style="width:600px;height:600px;object-fit:contain"></div>
  <div class="abs" style="left:150px;top:230px;width:980px;display:flex;flex-direction:column;gap:34px">
    <p class="eyebrow" style="font-size:30px" data-in="0.4" data-fx="fade">FLOWER POST — ANYANG</p>
    <h1 class="serif" style="font-size:150px;line-height:1.05;color:var(--wine);font-weight:700" data-in="0.8" data-fx="up">꽃말 우체국</h1>
    <p class="serif" style="font-size:58px;line-height:1.45;font-weight:700" data-in="2.2" data-fx="up">말로 하기 쑥스러운 진심,</p>
    <p class="serif" style="font-size:58px;line-height:1.45;font-weight:700;margin-top:-26px" data-in="3.4" data-fx="up">꽃말에 담아 대신 전해드립니다.</p>
    <p style="font-size:32px;color:var(--muted)" data-in="5.0" data-fx="up">직접 쓴 편지와 꽃말을 담은 꽃을 함께 보내는 꽃집</p>
  </div>
</section>
<section class="scene" data-scene="8" style="background:var(--paper)">
  <div class="abs center" style="left:0;right:0;top:130px;gap:18px">
    <p class="eyebrow" style="font-size:28px" data-in="8.4" data-fx="fade">HOW IT WORKS</p>
    <h2 class="serif" style="font-size:84px;color:var(--wine);font-weight:700" data-in="8.6" data-fx="up">편지 한 통이 도착하기까지</h2>
  </div>
  <div class="abs" style="left:220px;right:220px;top:620px;height:6px;background:var(--blush-2);transform-origin:left" data-in="9.2" data-fx="grow" data-dur="3"></div>
  <div class="abs" style="left:140px;right:140px;top:430px;display:grid;grid-template-columns:repeat(4,1fr);gap:40px">
    ${[['letter', '편지 쓰기', '직접 쓴 편지를 준비해요'], ['flower', '꽃 고르기', '마음에 맞는 꽃말의 꽃'], ['store', '매장에서 제작', '안양 매장에서 엮고 봉인'], ['box', '배송 · 픽업', '택배 또는 매장 픽업']].map(([ic, t, d], i) => `

</section>
<section class="scene" data-scene="16" style="background:var(--white)">

  </div>
  <div class="abs" style="left:150px;right:150px;top:330px;display:grid;grid-template-columns:repeat(3,1fr);gap:48px">
    ${[['bouquet-lover', '연인에게', '앞으로도 변함없이 사랑해'], ['bouquet-mom', '엄마에게', '엄마 키워줘서 고마워요'], ['bouquet-friend', '친구에게', '미안해, 오해였어. 진심이야']].map(([im, to, msg], i) => `
    <div style="display:flex;flex-direction:column;gap:18px" data-in="${(17.3 + i * 0.9).toFixed(1)}" data-fx="up">
      <div style="height:440px;border-radius:32px;overflow:hidden;background:var(--blush)"><img data-loop="zoom" src="${IMG}${im}.png" style="width:100%;height:100%;object-fit:cover"></div>
      <p class="eyebrow" style="font-size:24px">${to}</p>
      <p class="serif" style="font-size:38px;font-weight:700">“${msg}”</p>
    </div>`).join('')}
  </div>
</section>
<section class="scene center" data-scene="24" style="background:var(--wine);gap:30px">
  ${petals([[200, 160, 26, '#B66B7C', 0], [1640, 220, 22, '#C98A97', 2], [1500, 820, 30, '#B66B7C', 4], [320, 800, 20, '#C98A97', 1]])}
  <div class="center" style="width:300px;height:300px;border-radius:50%;background:var(--blush)" data-in="24.5" data-fx="pop"><img src="${IMG}logo.png" style="width:250px;height:250px;object-fit:contain"></div>
  <h2 class="serif" style="font-size:86px;color:var(--white);font-weight:700" data-in="25.2" data-fx="up">누구에게 마음을 전하고 싶으신가요?</h2>
  <p style="font-size:38px;color:#F1DFE2" data-in="26.2" data-fx="up">꽃말 우체국 홈페이지에서 지금 주문하세요</p>
  <p class="chip" style="font-size:32px;background:var(--white);color:var(--wine);padding:20px 48px;margin-top:10px;font-family:monospace" data-in="27.0" data-fx="pop">ojimin106-dotcom.github.io/jimin</p>
</section>`,

  </div>
</section>`,

<section class="scene" data-scene="0" style="background:var(--blush)">

  <div class="abs center" style="left:0;right:0;top:200px;gap:14px">

  <div class="abs center" style="left:0;right:0;top:1440px;gap:12px">

<section class="scene" data-scene="8.5" style="background:var(--paper)">
  <div class="abs" style="left:140px;top:240px;width:800px;height:800px;border-radius:48px;overflow:hidden;background:var(--blush)" data-in="8.9" data-fx="pop"><img data-loop="zoom" src="${IMG}bouquet-lover.png" style="width:100%;height:100%;object-fit:cover"></div>
  <div class="abs center" style="left:60px;right:60px;top:1140px;gap:14px">
    <p class="serif" style="font-size:92px;font-weight:700;color:var(--wine)" data-in="9.6" data-fx="up">편지에 곁들여 보세요</p>
    <p style="font-size:40px;color:var(--muted);margin-top:10px" data-in="10.6" data-fx="up">연인에게 · 결혼기념일 · 변함없는 우정</p>
  </div>
  <div class="abs center" style="left:0;right:0;top:1580px;gap:10px" data-in="11.8" data-fx="up">
    <p class="chip" style="font-size:46px;background:var(--wine);color:var(--white);padding:26px 60px">꽃말 우체국에서 주문하기</p>
  </div>
</section>`,

s3: `
<section class="scene" data-scene="0" style="background:var(--paper)">
  <div class="abs center" style="left:60px;right:60px;top:330px;gap:10px">
    <p class="serif" style="font-size:118px;font-weight:700;color:var(--wine);line-height:1.3" data-in="0.4" data-fx="up">누구에게</p>

  <div class="abs" style="left:100px;right:100px;top:1100px;display:flex;flex-wrap:wrap;justify-content:center;gap:26px">

<section class="scene" data-scene="6.8" style="background:var(--wine)">

stage.innerHTML = FILMS[V];
const EASE = 'cubic-bezier(.2,.7,.2,1)';
const FX = {
  up: [{ opacity: 0, transform: 'translateY(60px)' }, { opacity: 1, transform: 'none' }],
  down: [{ opacity: 0, transform: 'translateY(-60px)' }, { opacity: 1, transform: 'none' }],
  left: [{ opacity: 0, transform: 'translateX(-120px)' }, { opacity: 1, transform: 'none' }],
  right: [{ opacity: 0, transform: 'translateX(120px)' }, { opacity: 1, transform: 'none' }],
  fade: [{ opacity: 0 }, { opacity: 1 }],
  pop: [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1.04)', offset: .7 }, { opacity: 1, transform: 'scale(1)' }],
  grow: [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }]
};
document.querySelectorAll('[data-scene]').forEach((s, i) => {
  const t = parseFloat(s.dataset.scene);
  if (i > 0) s.animate([{ opacity: 0 }, { opacity: 1 }], { delay: t * 1000, duration: 600, fill: 'both', easing: 'ease-out' });
});
document.querySelectorAll('[data-in]').forEach(el => {
  const t = parseFloat(el.dataset.in), d = parseFloat(el.dataset.dur || '0.8');
  el.animate(FX[el.dataset.fx || 'up'], { delay: t * 1000, duration: d * 1000, fill: 'both', easing: EASE });
});
const LOOP = {
  float: [[{ transform: 'translateY(0) rotate(-1deg)' }, { transform: 'translateY(-16px) rotate(1deg)' }, { transform: 'translateY(0) rotate(-1deg)' }], 5000],
  drift: [[{ transform: 'translate(0,0) rotate(0)' }, { transform: 'translate(40px,60px) rotate(60deg)' }, { transform: 'translate(0,0) rotate(0)' }], 8000],
  spin: [[{ transform: 'rotate(0)' }, { transform: 'rotate(360deg)' }], 40000],
  zoom: [[{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }], 9000]
};
document.querySelectorAll('[data-loop]').forEach(el => {
  const [k, d] = LOOP[el.dataset.loop];
  el.animate(k, { duration: d, iterations: Infinity, delay: -parseFloat(el.dataset.d || 0) * 1000, direction: el.dataset.loop === 'zoom' ? 'alternate' : 'normal' });
});
const ALL = document.getAnimations();
ALL.forEach(a => a.pause());
window.FILM = { W, H, DUR };
window.seek = t => { ALL.forEach(a => { a.currentTime = t * 1000; }); };
seek(parseFloat(P.get('t') || '0'));
</script>
